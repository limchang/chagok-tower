<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="차곡탑 아이콘: 차곡차곡 쌓인 층">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8df7"/>
      <stop offset="1" stop-color="#9ad0ff"/>
    </linearGradient>
  </defs>

  <!-- 배경: 맑은 낮 하늘(모서리는 올리는 곳에서 깎으므로 꽉 채움) -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="96" cy="118" r="74" fill="#ffffff" opacity="0.10"/>
  <circle cx="436" cy="208" r="52" fill="#ffffff" opacity="0.12"/>
  <circle cx="404" cy="452" r="88" fill="#ffffff" opacity="0.08"/>

  <!-- 받침대 -->
  <rect x="100" y="420" width="312" height="120" rx="16" fill="#14183c" opacity="0.28"/>

  <!-- 쌓인 층 5개(아래 → 위): 어두운 밑면 + 몸통 + 윗면 밝은 띠 -->
  <g>
    <rect x="116" y="366" width="280" height="54" rx="12" fill="#b3505a"/>
    <rect x="116" y="366" width="280" height="44" rx="12" fill="#ff6b6b"/>
    <rect x="124" y="372" width="264" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
  </g>
  <g>
    <rect x="126" y="312" width="262" height="54" rx="12" fill="#b35c55"/>
    <rect x="126" y="312" width="262" height="44" rx="12" fill="#ff7d62"/>
    <rect x="134" y="318" width="246" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
  </g>
  <g>
    <rect x="140" y="258" width="240" height="54" rx="12" fill="#b3684f"/>
    <rect x="140" y="258" width="240" height="44" rx="12" fill="#ff9058"/>
    <rect x="148" y="264" width="224" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
  </g>
  <g>
    <rect x="140" y="204" width="226" height="54" rx="12" fill="#b3734a"/>
    <rect x="140" y="204" width="226" height="44" rx="12" fill="#ffa24f"/>
    <rect x="148" y="210" width="210" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
  </g>
  <g>
    <rect x="156" y="150" width="210" height="54" rx="12" fill="#b37e44"/>
    <rect x="156" y="150" width="210" height="44" rx="12" fill="#ffb347"/>
    <rect x="164" y="156" width="194" height="10" rx="5" fill="#ffffff" opacity="0.45"/>
    <!-- 떠 있는 층의 그림자 -->
    <rect x="196" y="150" width="170" height="8" rx="4" fill="#14183c" opacity="0.18"/>
  </g>

  <!-- 내려올 차례인 층(오른쪽으로 살짝 어긋남) -->
  <g>
    <rect x="196" y="72" width="210" height="54" rx="12" fill="#b3a35a"/>
    <rect x="196" y="72" width="210" height="44" rx="12" fill="#ffe66d"/>
    <rect x="204" y="78" width="194" height="10" rx="5" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- 「딱」 별빛 -->
  <path d="M142 62 L149 87 L174 94 L149 101 L142 126 L135 101 L110 94 L135 87 Z" fill="#ffffff"/>
  <circle cx="186" cy="48" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="104" cy="142" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
